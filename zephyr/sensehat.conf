# Sense HAT V2 のセンサー(P2)。検証用プログラム(sensehat-probe)の設定と同じ。
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_HTS221=y
CONFIG_LPS25HB=y
CONFIG_LSM9DS1=y
CONFIG_LSM9DS1_MAG=y

# CONFIG_SENSOR=y で、ボード標準の VC 温度センサーが有効になり、GL 版で無効にしている
# firmware ノードに依存して Kconfig の警告で止まるため、使わないこのドライバを切る。
CONFIG_RASPBERRYPI_BCM283X_VC_THERMAL=n
