# SPDX-License-Identifier: BSD-3-Clause
# Sense HAT V2 sensors.
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_HTS221=y
CONFIG_LPS25HB=y
CONFIG_LSM9DS1=y
CONFIG_LSM9DS1_MAG=y

# CONFIG_SENSOR=y also enables the board's VC thermal sensor driver. It depends on the
# firmware node, which the GL configuration disables, and Kconfig stops with a warning.
# The driver is not needed, so it is turned off.
CONFIG_RASPBERRYPI_BCM283X_VC_THERMAL=n
